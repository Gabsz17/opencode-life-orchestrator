name: trends-diario

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC diario
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Coleta trends
        env:
          TIKTOK_CREATIVE_CENTER_KEY: ${{ secrets.TIKTOK_CREATIVE_CENTER_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-trends.mjs --force
      - name: Commit automatico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ganhos/trends-cache/ || true
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "chore(trends): cache diario $(date -u +%F)"
            git push
          fi
